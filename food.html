<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)" />
    <title>Food · Daniel's Lyfe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="back" href="index.html">&larr; Daniel's Lyfe</a>
      <h1>Food</h1>
    </header>
    <main>
      <section aria-labelledby="general-heading">
        <h2 id="general-heading">General guidelines</h2>
        <ul class="rules">
          <li class="card do">
            <span class="rule-label">Do</span>
            <span class="rule-text">Eat healthy</span>
          </li>
          <li class="card dont">
            <span class="rule-label">Avoid</span>
            <span class="rule-text">Salty and sugary snacks</span>
          </li>
        </ul>
      </section>

      <section aria-labelledby="specific-heading">
        <h2 id="specific-heading">Specifics</h2>
        <ul class="schedule">
          <li>
            <span class="meal-label">Breakfast</span>
            <span class="task">Protein smoothie</span>
          </li>
          <li>
            <span class="meal-label">Lunch</span>
            <span class="task">Healthy lunch</span>
          </li>
          <li>
            <span class="meal-label">Dinner</span>
            <span class="task">Dinner with Dad &amp; Cathy</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
